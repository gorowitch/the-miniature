<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>De Miniatuur - panel 5a</title>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&amp;display=swap');
      .ink{stroke:#17110d;stroke-linejoin:round;stroke-linecap:round}
      .letter{font-family:'Comic Neue','Comic Sans MS',cursive;font-weight:700;fill:#17110d}
    </style>
    <filter id="soft" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="3.2"/></filter>
    <pattern id="halftone" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <circle cx="4.5" cy="4.5" r="1.5" fill="#000" opacity=".10"/>
    </pattern>
    <pattern id="halftoneRed" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="3" cy="3" r="1.3" fill="#c0392b" opacity=".55"/>
    </pattern>
    <pattern id="grain" width="40" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 6 C10 3 20 9 40 5" stroke="#b98a56" stroke-width=".9" fill="none" opacity=".55"/>
    </pattern>
    <clipPath id="frame"><rect x="12" y="12" width="776" height="576" rx="6"/></clipPath>
    <radialGradient id="burstGlow" cx="0.54" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#fff6d6"/><stop offset="1" stop-color="#fff6d6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#frame)">
    <!-- chess club room, soft and out of focus, no people, no text -->
    <g filter="url(#soft)">
      <rect x="0" y="0" width="800" height="600" fill="#cfd8c6"/>
      <rect x="0" y="330" width="800" height="270" fill="#8d6b4a"/>
      <rect x="0" y="322" width="800" height="14" fill="#6e5136"/>
      <!-- tall windows -->
      <rect x="60" y="40" width="120" height="220" fill="#e9eedc"/>
      <rect x="620" y="40" width="120" height="220" fill="#e9eedc"/>
      <path d="M120 40 V260 M60 150 H180 M680 40 V260 M620 150 H740" stroke="#b9c2ad" stroke-width="6"/>
      <!-- distant tables with boards and a chess clock -->
      <rect x="20" y="300" width="230" height="22" fill="#5d4330"/>
      <rect x="70" y="284" width="90" height="16" fill="#3b2b20"/>
      <rect x="70" y="284" width="22" height="8" fill="#e6d6ae"/><rect x="114" y="284" width="22" height="8" fill="#e6d6ae"/><rect x="92" y="292" width="22" height="8" fill="#e6d6ae"/><rect x="136" y="292" width="22" height="8" fill="#e6d6ae"/>
      <rect x="185" y="272" width="46" height="28" rx="4" fill="#4a3526"/>
      <rect x="560" y="296" width="240" height="22" fill="#5d4330"/>
      <rect x="600" y="280" width="90" height="16" fill="#3b2b20"/>
      <rect x="600" y="280" width="22" height="8" fill="#e6d6ae"/><rect x="644" y="280" width="22" height="8" fill="#e6d6ae"/><rect x="622" y="288" width="22" height="8" fill="#e6d6ae"/><rect x="666" y="288" width="22" height="8" fill="#e6d6ae"/>
      <!-- chair backs -->
      <path d="M270 330 V230 Q300 215 330 230 V330" fill="#6b4c33"/>
      <path d="M470 330 V236 Q498 222 526 236 V330" fill="#6b4c33"/>
    </g>
    <rect x="0" y="0" width="800" height="600" fill="url(#halftone)"/>

    <!-- outburst: speed lines behind the King -->
    <g opacity=".85">
      <rect x="0" y="0" width="800" height="600" fill="url(#burstGlow)"/>
      <g stroke="#fffaf0" stroke-width="6" stroke-linecap="round">
        <path d="M430 250 L430 -40"/><path d="M430 250 L250 -30"/><path d="M430 250 L610 -30"/>
        <path d="M430 250 L120 40"/><path d="M430 250 L740 40"/><path d="M430 250 L60 200"/>
        <path d="M430 250 L800 190"/><path d="M430 250 L340 -40"/><path d="M430 250 L520 -40"/>
      </g>
    </g>

    <!-- REGINA (d1), partly at the right edge: light strawberry-blonde hair, white-and-gold costume, mouth closed, looking at the King -->
    <g class="ink" stroke-width="3.5">
      <path d="M690 600 C694 470 700 420 718 395 L790 395 C806 420 814 470 818 600 Z" fill="#f7f3ea"/>
      <path d="M700 600 C703 480 708 430 722 405" fill="none" stroke="#d4a72c" stroke-width="6"/>
      <path d="M760 600 C760 500 758 440 752 405" fill="none" stroke="#d4a72c" stroke-width="5"/>
      <path d="M690 600 C694 470 700 420 718 395" fill="none"/>
      <path d="M698 300 C680 340 684 400 706 430 C716 380 712 340 714 300 Z" fill="#e8b77a"/>
      <path d="M800 300 C818 340 816 400 796 430 C788 380 790 340 790 300 Z" fill="#e8b77a"/>
      <circle cx="752" cy="305" r="56" fill="#efd2a2"/>
      <path d="M700 290 C708 240 800 236 808 292 C790 268 720 266 700 290 Z" fill="#e8b77a"/>
      <path d="M708 252 L700 196 L728 226 L752 180 L776 226 L804 196 L796 252 Z" fill="#efd2a2"/>
      <circle cx="700" cy="194" r="7" fill="#efd2a2"/><circle cx="752" cy="177" r="7" fill="#efd2a2"/><circle cx="804" cy="194" r="7" fill="#efd2a2"/>
      <!-- eyes looking left at the King -->
      <ellipse cx="732" cy="300" rx="13" ry="16" fill="#fff"/><ellipse cx="770" cy="300" rx="13" ry="16" fill="#fff"/>
      <circle cx="725" cy="303" r="6.5" fill="#17110d" stroke="none"/><circle cx="763" cy="303" r="6.5" fill="#17110d" stroke="none"/>
      <path d="M716 278 Q730 270 744 280 M758 280 Q772 270 786 278" fill="none" stroke-width="4"/>
      <path d="M748 312 Q744 330 752 334 Q760 332 756 312" fill="#e0a77c" stroke-width="2.5"/>
      <path d="M738 346 Q750 340 762 346" fill="none" stroke-width="3"/>
    </g>

    <!-- ALFIL (f1), partly at the left edge: advisor robes, mitre with paprika stains, taken aback, mouth closed -->
    <g class="ink" stroke-width="3.5">
      <path d="M-20 600 C-14 470 4 420 30 398 L150 398 C176 420 194 470 200 600 Z" fill="#46607f"/>
      <path d="M30 398 L150 398 L140 430 L40 430 Z" fill="#d9c69a"/>
      <path d="M90 430 V600" fill="none" stroke="#d9c69a" stroke-width="7"/>
      <path d="M40 470 C60 500 70 560 64 600" fill="none" stroke="#2e4560" stroke-width="3"/>
      <circle cx="90" cy="335" r="58" fill="#efd2a2"/>
      <path d="M38 290 C30 230 62 160 90 130 C118 160 150 230 142 290 C110 278 70 278 38 290 Z" fill="#f2e3c2"/>
      <path d="M96 140 L118 262" fill="none" stroke-width="3"/>
      <g stroke="none" fill="#d9541e"><ellipse cx="66" cy="230" rx="6" ry="4.5"/><ellipse cx="110" cy="200" rx="4.5" ry="3.5"/><ellipse cx="124" cy="244" rx="5.5" ry="4"/><ellipse cx="80" cy="190" rx="3.5" ry="3"/><ellipse cx="56" cy="262" rx="4" ry="3"/></g>
      <!-- wide eyes looking right at the King -->
      <ellipse cx="72" cy="330" rx="16" ry="21" fill="#fff"/><ellipse cx="112" cy="330" rx="16" ry="21" fill="#fff"/>
      <circle cx="80" cy="332" r="5" fill="#17110d" stroke="none"/><circle cx="120" cy="332" r="5" fill="#17110d" stroke="none"/>
      <path d="M56 300 Q70 290 86 296 M98 296 Q114 290 128 300" fill="none" stroke-width="4"/>
      <path d="M94 346 Q86 368 98 372 Q110 368 104 346" fill="#e0a77c" stroke-width="2.5"/>
      <path d="M80 384 Q92 380 104 386" fill="none" stroke-width="3"/>
      <!-- sweat drops -->
      <path d="M150 300 Q158 288 160 300 Q158 310 150 300 Z" fill="#bfe3f5" stroke-width="2"/>
      <path d="M160 330 Q166 320 168 330 Q166 338 160 330 Z" fill="#bfe3f5" stroke-width="2"/>
    </g>

    <!-- KONING (e1): burgundy robe with medals, simple medieval crown, furious, shouting, fist raised, looking at Alfil -->
    <g class="ink" stroke-width="4.5">
      <!-- robe -->
      <path d="M262 600 C268 470 300 392 352 360 L508 360 C560 392 592 470 598 600 Z" fill="#7d1f2e"/>
      <path d="M430 600 C470 520 520 450 560 420 L598 600 Z" fill="#5e1622" stroke="none"/>
      <path d="M262 600 C268 470 300 392 352 360 L508 360 C560 392 592 470 598 600" fill="none"/>
      <path d="M352 360 C380 392 480 392 508 360" fill="#d4a72c" stroke-width="3.5"/>
      <path d="M430 392 V600" fill="none" stroke="#d4a72c" stroke-width="8"/>
      <path d="M430 392 V600" fill="none" stroke-width="2"/>
      <!-- medals -->
      <g stroke-width="2.5">
        <path d="M466 420 L478 450 L490 420 Z" fill="#1f4e8c"/><circle cx="478" cy="462" r="13" fill="#e2b33a"/><path d="M478 455 L481 461 L488 462 L483 467 L484 474 L478 470 L472 474 L473 467 L468 462 L475 461 Z" fill="#fff3c4" stroke-width="1.2"/>
        <path d="M498 424 L508 452 L518 424 Z" fill="#b8202e"/><circle cx="508" cy="464" r="12" fill="#e2b33a"/>
        <path d="M376 424 L386 452 L396 424 Z" fill="#2e7a3a"/><circle cx="386" cy="464" r="12" fill="#e2b33a"/>
      </g>
      <!-- raised arm and fist (the King's right, viewer's left) -->
      <path d="M332 380 C300 330 288 270 286 206" fill="none" stroke-width="44"/>
      <path d="M332 380 C300 330 288 270 286 206" fill="none" stroke="#7d1f2e" stroke-width="35"/>
      <path d="M262 214 L308 214" fill="none" stroke="#d4a72c" stroke-width="8"/>
      <circle cx="284" cy="176" r="34" fill="#efd2a2"/>
      <path d="M312 162 Q300 156 288 162 M308 178 Q296 172 284 178 M304 194 Q292 188 280 194" fill="none" stroke-width="3"/>
      <path d="M268 150 Q256 160 260 176" fill="none" stroke-width="3"/>
      <!-- shake lines around the fist -->
      <path d="M238 150 l-18 -8 M234 176 l-22 0 M240 204 l-18 8 M330 136 l12 -14" fill="none" stroke-width="4"/>
      <!-- head -->
      <circle cx="430" cy="262" r="74" fill="#efd2a2"/>
      <circle cx="430" cy="262" r="74" fill="url(#grain)" stroke="none" opacity=".6"/>
      <path d="M470 205 C500 230 506 290 480 320 C496 280 494 240 470 205 Z" fill="#d3aa70" stroke="none"/>
      <circle cx="430" cy="262" r="74" fill="none"/>
      <!-- red face (anger) -->
      <circle cx="430" cy="262" r="70" fill="url(#halftoneRed)" stroke="none"/>
      <!-- simple medieval crown -->
      <path d="M360 206 L354 142 L384 174 L408 128 L430 166 L452 128 L476 174 L506 142 L500 206 Z" fill="#efd2a2"/>
      <path d="M360 206 L500 206 L498 194 L362 194 Z" fill="#d3aa70" stroke-width="3.5"/>
      <path d="M424 128 V92 M412 106 H448 M436 92 V128" fill="none" stroke-width="0"/>
      <path d="M422 132 V96 H410 V84 H422 V72 H438 V84 H450 V96 H438 V132 Z" fill="#efd2a2" stroke-width="3.5"/>
      <!-- anger mark -->
      <path d="M496 222 q8 -12 16 0 M498 238 q8 12 16 0 M490 226 q-12 8 0 16 M520 226 q12 8 0 16" fill="none" stroke="#c0392b" stroke-width="4"/>
      <!-- furious brows and eyes, looking left at Alfil -->
      <path d="M368 222 L424 244" fill="none" stroke-width="10"/>
      <path d="M492 222 L436 244" fill="none" stroke-width="10"/>
      <ellipse cx="402" cy="258" rx="17" ry="13" fill="#fff"/><ellipse cx="458" cy="258" rx="17" ry="13" fill="#fff"/>
      <circle cx="394" cy="260" r="6" fill="#17110d" stroke="none"/><circle cx="450" cy="260" r="6" fill="#17110d" stroke="none"/>
      <!-- nose -->
      <path d="M430 262 C410 268 410 300 430 302 C450 300 450 268 430 262 Z" fill="#e0a77c" stroke-width="3"/>
      <!-- beard (medium) -->
      <path d="M368 300 C356 344 384 392 430 400 C476 392 504 344 492 300 C470 320 390 320 368 300 Z" fill="#f4f0e6" stroke-width="3.5"/>
      <path d="M392 352 q4 16 -2 30 M430 364 v28 M468 352 q-4 16 2 30" fill="none" stroke="#c9c2b2" stroke-width="2.5"/>
      <!-- wide open shouting mouth -->
      <path d="M398 318 C404 312 456 312 462 318 C466 352 450 372 430 372 C410 372 394 352 398 318 Z" fill="#5a1a12" stroke-width="3.5"/>
      <path d="M404 318 C420 324 440 324 456 318 L454 328 C438 332 422 332 406 328 Z" fill="#fffaf0" stroke-width="2"/>
      <path d="M412 360 C420 348 440 348 448 360 C440 368 420 368 412 360 Z" fill="#c75a4a" stroke="none"/>
      <!-- moustache -->
      <path d="M430 306 C414 296 388 298 374 318 C392 314 410 318 430 314 C450 318 468 314 486 318 C472 298 446 296 430 306 Z" fill="#f4f0e6" stroke-width="3"/>
    </g>

    <!-- SHOUT BALLOON (jagged), Koning; tail to his mouth -->
    <g>
      <path d="M568 140 Q566 262 500 322 Q596 258 612 140 Z" fill="#fffdf5" stroke="#17110d" stroke-width="4" stroke-linejoin="round"/>
      <path d="M780.0 84.0 L752.1 95.4 L769.2 110.7 L734.3 116.7 L738.2 133.9 L701.0 133.6 L691.3 150.2 L656.8 143.8 L634.8 157.7 L607.6 145.9 L576.2 155.2 L560.1 139.6 L523.6 143.1 L520.7 125.9 L484.0 123.0 L494.7 106.5 L462.7 97.6 L485.6 84.0 L462.7 70.4 L494.7 61.5 L484.0 45.0 L520.7 42.1 L523.6 24.9 L560.1 28.4 L576.2 12.8 L607.6 22.1 L634.8 10.3 L656.8 24.2 L691.3 17.8 L701.0 34.4 L738.2 34.1 L734.3 51.3 L769.2 57.3 L752.1 72.6 Z" fill="#fffdf5" stroke="#17110d" stroke-width="4" stroke-linejoin="miter"/>
      <path d="M572 141 Q590 146 608 141" fill="none" stroke="#fffdf5" stroke-width="9"/>
      <text class="letter" x="620" y="66" text-anchor="middle" font-size="20">Wie is er hier nu</text>
      <text class="letter" x="620" y="91" text-anchor="middle" font-size="20">godverdoemme eigenlijk</text>
      <text class="letter" x="620" y="116" text-anchor="middle" font-size="20">koning ? Alfil, gene zever.</text>
    </g>
  </g>

  <!-- panel border -->
  <rect x="12" y="12" width="776" height="576" rx="6" fill="none" stroke="#17110d" stroke-width="7"/>
</svg>
