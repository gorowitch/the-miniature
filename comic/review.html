<!doctype html><html><head><meta charset="utf-8"><title>Panel review</title>
<style>body{margin:0;padding:4px;background:#333;color:#fff;font:12px sans-serif;display:grid;grid-template-columns:1fr 1fr;gap:4px}div.w{grid-column:span 2}svg{display:block;width:100%;background:#fff}</style></head><body>
<script src="renderer.js"></script><script src="panels.js"></script>
<script>
// Review helper: review.html?from=6a&n=6 renders panels one by one at a readable size.
const q = new URLSearchParams(location.search), all = window.PANELS;
const i0 = Math.max(0, all.findIndex(p => p.id === (q.get("from") || all[0].id))), n = +(q.get("n") || 6);
for (const P of all.slice(i0, i0 + n)) {
  const d = document.createElement("div"); if (P.wide) d.className = "w"; d.textContent = P.id + " (" + P.status + ")";
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); d.appendChild(s); document.body.appendChild(d);
  try { window.MiniatuurRenderer.renderPanel(s, P, { mark: true }); } catch (e) { d.textContent += " ERROR " + e.message; }
}
</script></body></html>
